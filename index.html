<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ClearPrint · 批量去水印</title>
<!-- 跨源隔离：GitHub Pages 不能自定义响应头，这里用 Service Worker 注入 COOP/COEP，
     让 onnxruntime 的多线程 WASM（SharedArrayBuffer）可用。
     本地 serve.py 已经带了这两个头 → 页面打开时就是隔离态，本脚本会自动跳过、不会重复刷新。
     必须在最前面同步加载：它依赖 document.currentScript 来定位自己的 SW 地址。 -->
<script src="coi-serviceworker.js"></script>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<header class="top">
  <div class="brand">
    <svg class="logo" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="3" y="3" width="26" height="26" rx="6" fill="none" stroke="currentColor" stroke-width="2.2"/>
      <path d="M9 20.5 13.5 15l4 4.5L22 11" fill="none" stroke="currentColor" stroke-width="2.4"
            stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="24" cy="8" r="3.4" fill="currentColor"/>
    </svg>
    <div>
      <h1>ClearPrint</h1>
      <p class="tag">批量去水印 · 图片不出本机</p>
    </div>
  </div>
  <div class="top-right">
    <span id="engineBadge" class="badge badge-wait" title="AI 修复引擎状态">引擎加载中…</span>
    <button id="btnHelp" class="ghost" type="button">怎么用</button>
  </div>
</header>

<main class="wrap">

  <!-- ------------------------------------------------ 步骤 1：导入 -->
  <section class="card" id="cardImport">
    <div class="card-hd">
      <span class="step">1</span>
      <h2>导入图片</h2>
      <span class="hint" id="importHint">支持 JPG / PNG / WebP，可整文件夹拖入</span>
    </div>
    <div class="drop" id="drop">
      <svg viewBox="0 0 24 24" class="dropi" aria-hidden="true">
        <path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M3.5 15v3.5A2.5 2.5 0 0 0 6 21h12a2.5 2.5 0 0 0 2.5-2.5V15"
              fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <p class="dropt">把整个文件夹拖进来</p>
      <p class="drops">或</p>
      <div class="dropbtns">
        <button class="primary" id="btnPickFolder" type="button">选择文件夹</button>
        <button class="ghost" id="btnPickFiles" type="button">选单个/多张图片</button>
      </div>
      <input type="file" id="fileInput" accept="image/*" multiple hidden>
      <input type="file" id="dirInput" webkitdirectory directory multiple hidden>
    </div>
  </section>

  <!-- ------------------------------------------------ 步骤 2：标水印 -->
  <section class="card" id="cardMark" hidden>
    <div class="card-hd">
      <span class="step">2</span>
      <h2>标出位置</h2>
      <span class="hint">涂一张，同一个位置就能套用到整批</span>
    </div>

    <div class="mark-body">
      <div class="stage-col">
        <div class="stage-bar">
          <button class="chip" id="btnPrev" type="button" title="上一张">‹</button>
          <span class="stage-name" id="stageName">—</span>
          <span class="stage-idx" id="stageIdx">0 / 0</span>
          <button class="chip" id="btnNext" type="button" title="下一张">›</button>
          <span class="spacer"></span>
          <span class="mode-tabs" role="tablist">
            <button class="tab on" data-view="edit" role="tab">涂抹</button>
            <button class="tab" data-view="before" role="tab">原图</button>
            <button class="tab" data-view="after" role="tab">效果</button>
          </span>
        </div>
        <div class="canvas-wrap" id="canvasWrap">
          <div class="cstage" id="cstage">
            <canvas id="baseCanvas"></canvas>
            <canvas id="maskCanvas"></canvas>
          </div>
          <div class="canvas-empty" id="canvasEmpty">还没有图片</div>
          <div class="canvas-note" id="canvasNote">框内为图片，可涂抹</div>
        </div>
      </div>

      <aside class="tools">
        <div class="tool-group">
          <label class="tl">涂抹工具</label>
          <div class="tools2">
            <button class="toolbtn on" id="btnBrush" type="button" data-tool="brush">
              <span class="tb-i">✎</span><span class="tb-t">画笔</span><span class="tb-s">涂上标记</span>
            </button>
            <button class="toolbtn" id="btnEraser" type="button" data-tool="erase">
              <span class="tb-i">◻</span><span class="tb-t">橡皮</span><span class="tb-s">擦掉标记</span>
            </button>
          </div>
          <label class="tl" style="margin-top:12px">笔刷大小 <b id="brushVal">34</b> px</label>
          <input type="range" id="brush" min="6" max="160" value="34">
          <div class="brush-tip" id="brushTip">在图上<b>按住拖动</b>即可涂抹水印位置</div>
        </div>

        <div class="tool-group">
          <button class="wide" id="btnDetect" type="button">自动探测水印</button>
          <div id="detectResult" class="detect-res"></div>
        </div>

        <div class="tool-group">
          <label class="tl">快速框选</label>
          <div class="quad">
            <button data-quad="tl" type="button">↖ 左上</button>
            <button data-quad="tr" type="button">↗ 右上</button>
            <button data-quad="bl" type="button">↙ 左下</button>
            <button data-quad="br" type="button">↘ 右下</button>
            <button data-quad="bc" type="button">↓ 底部通栏</button>
            <button data-quad="cc" type="button">◎ 画面中央</button>
          </div>
        </div>

        <div class="tool-group">
          <label class="tl">操作</label>
          <div class="quad2">
            <button id="btnClearMask" type="button">清空涂抹</button>
            <button id="btnUndo" type="button">撤销一笔</button>
          </div>
        </div>

        <div class="tool-group">
          <label class="tl">处理方式</label>
          <div class="modes">
            <label><input type="radio" name="mode" value="auto" checked>
              <span><b>自动</b><i>先试半透明还原，不行再上 AI</i></span></label>
            <label><input type="radio" name="mode" value="alpha">
              <span><b>半透明水印还原</b><i>快，细节不糊（浅色水印首选）</i></span></label>
            <label><input type="radio" name="mode" value="lama">
              <span><b>AI 生成式修复</b><i>实心水印 / 压在花纹上</i></span></label>
          </div>
        </div>

        <div class="tool-group">
          <label class="tl">细节补充</label>
          <select id="detailLevel" class="wide">
            <option value="normal" selected>标准 · AI 重建元素 + 保留原图细节</option>
            <option value="strong">强 · 锐度拉满（参考范围更聚焦）</option>
            <option value="off">关 · 只用 AI 输出，不叠原图细节</option>
          </select>
          <p class="tl-sub">只影响「AI 生成式修复」。水印盖住的区域由 AI 重建，
            周围一圈则用原图的高频细节接上，避免整块变糊。</p>
        </div>

        <div class="tool-group">
          <label class="ck"><input type="checkbox" id="applyAll" checked>
            <span>把这张的涂抹套用到<b>全部</b>图片（同位置）</span></label>
        </div>
      </aside>
    </div>
  </section>

  <!-- ------------------------------------------------ 步骤 3：跑 -->
  <section class="card" id="cardRun" hidden>
    <div class="card-hd">
      <span class="step">3</span>
      <h2>批量处理</h2>
      <span class="hint" id="runHint"></span>
    </div>

    <div class="runbar">
      <button class="primary big" id="btnRun" type="button" disabled>开始处理</button>
      <button class="ghost" id="btnPreview" type="button" disabled>预览当前这张</button>
      <button class="ghost" id="btnRetry" type="button" hidden>重试失败项</button>
      <button class="ghost" id="btnCancel" type="button" hidden>停止</button>
      <span class="spacer"></span>
      <label class="sel">输出格式
        <select id="fmt">
          <option value="jpeg">JPG（推荐，体积小）</option>
          <option value="png">PNG（无损，体积大）</option>
        </select>
      </label>
      <button class="primary" id="btnZip" type="button" disabled>打包下载 ZIP</button>
    </div>

    <div class="pbar" id="pbar" hidden>
      <div class="pbar-fill" id="pbarFill"></div>
    </div>
    <p class="pstat" id="pstat"></p>

    <div class="failbox" id="failBox" hidden></div>

    <div class="grid" id="grid"></div>
  </section>

</main>

<div class="toast" id="toast" hidden></div>

<div class="modal" id="modal" hidden>
  <div class="modal-box">
    <h3 id="modalTitle">怎么用</h3>
    <div class="modal-body" id="modalBody"></div>
    <button class="primary" id="modalOk" type="button">知道了</button>
  </div>
</div>

<script src="js/cv.js"></script>
<script src="js/wipe.js"></script>
<script src="js/clear.js"></script>
<script src="js/zip.js"></script>
<script src="js/app.js"></script>
</body>
</html>
